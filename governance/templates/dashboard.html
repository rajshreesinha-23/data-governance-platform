{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">📊 Data Resources</h2>

<div class="row">
    {% for r in resources %}
    <div class="col-md-4">
        <div class="card bg-dark text-white shadow-lg mb-3">
            <div class="card-body">
                <h5>{{ r.name }}</h5>
                <p>{{ r.description }}</p>
                <a href="/resource/{{ r.id }}/" class="btn btn-primary">Access</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
