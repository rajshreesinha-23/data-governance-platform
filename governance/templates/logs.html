{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">📜 Audit Logs</h2>

<table class="table table-dark table-striped">
    <tr>
        <th>User</th>
        <th>Resource</th>
        <th>Time</th>
    </tr>

    {% for log in logs %}
    <tr>
        <td>{{ log.user }}</td>
        <td>{{ log.resource }}</td>
        <td>{{ log.access_time }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
