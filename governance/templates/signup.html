{% extends 'base.html' %}

{% block content %}
{% if messages %}
  {% for message in messages %}
    <p style="color:red;">{{ message }}</p>
  {% endfor %}
{% endif %}
<div class="d-flex justify-content-center">
    <form method="POST" class="card p-4 bg-dark text-white shadow-lg" style="width:300px;">
        {% csrf_token %}
        <h3>Signup</h3>
        <input name="username" class="form-control mb-2" placeholder="Username">
        <input name="password" type="password" class="form-control mb-2" placeholder="Password">
        <button class="btn btn-success">Create Account</button>
    </form>
</div>
{% endblock %}
