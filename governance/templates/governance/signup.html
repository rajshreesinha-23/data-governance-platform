{% extends 'governance/base.html' %}
{% block content %}
<div style="max-width:400px; margin:80px auto;">
  <div class="card">
    <h2 style="margin-bottom:20px; text-align:center;">📝 Sign Up</h2>
    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:15px;">
        <label>Username</label><br>
        <input type="text" name="username" required
          style="width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:4px;">
      </div>
      <div style="margin-bottom:15px;">
        <label>Password</label><br>
        <input type="password" name="password" required
          style="width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:4px;">
      </div>
      <div style="margin-bottom:15px;">
        <label>Role</label><br>
        <select name="role"
          style="width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:4px;">
          <option value="user">User</option>
          <option value="auditor">Auditor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:12px;">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:15px;">
      Already have an account? <a href="{% url 'login' %}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
